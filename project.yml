# XcodeGen project. Edit THIS file (not the .xcodeproj), then run:  xcodegen generate
name: NutraNutritionCoach
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  NutraCore:
    path: NutraCore

targets:
  NutraNutritionCoach:
    type: application
    platform: iOS
    sources:
      - path: NutraNutritionCoach
    dependencies:
      - package: NutraCore
        product: NutraCore
    info:
      path: NutraNutritionCoach/Info.plist
      properties:
        CFBundleDisplayName: Nutra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Nutra uses the camera to read food labels and photos of your meals.
        NSPhotoLibraryUsageDescription: Nutra reads the meal photo you choose to estimate what's in it.
        # Leave empty until the Supabase functions are deployed. Never put an AI key here.
        NutraBackendURL: ""
        # Supabase "anon public" key (safe to share). Only needed if JWT verification is on.
        NutraBackendAnonKey: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nutra   # placeholder: choose your own
        PRODUCT_NAME: NutraNutritionCoach
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: set your own Team in Xcode (Signing & Capabilities)

schemes:
  NutraNutritionCoach:
    build:
      targets:
        NutraNutritionCoach: all
    run:
      config: Debug
    archive:
      config: Release
